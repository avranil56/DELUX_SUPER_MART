{% extends "store/base.html" %}

{% block content %}

<div style="background-color: #3f51b5; min-height: 100vh; display: flex; justify-content: center; align-items: center;">

    <div style="background: white; padding: 30px; border-radius: 10px; width: 400px;">

        <h2 style="text-align:center; color:#3f51b5;">Add New Category</h2>

        <form method="POST">
            {% csrf_token %}

            <label>Category Name</label><br>
            <input type="text" name="category_name" required
                   style="width:100%; padding:8px; margin:15px 0; border-radius:4px; border:1px solid #ccc;">

            <button type="submit"
                    style="width:100%; padding:10px; background-color:#F4B400; border:none; border-radius:4px; font-weight:bold;">
                Add Category
            </button>
        </form>

    </div>

</div>

{% endblock %}
